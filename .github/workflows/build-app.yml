name: Build app

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Check uv version
        run: uv --version

      - name: Sync project dependencies
        run: uv sync --frozen

      - name: Test application imports
        run: uv run python -c "import main; print('Application imported successfully')"

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Check PyInstaller version
        run: uv run pyinstaller --version

      - name: Build Windows executable
        run: >
          uv run pyinstaller
          --name CALDISS_Anonymiserings_program
          --onedir
          --python-option "X utf8=1"
          --windowed
          --paths .
          --collect-submodules Shared_Functions
          --collect-submodules Pipelines.Frontend
          main.py
      
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            - Path "dist/CALDISS_Anonymiserings_program/*"
            -DistinationPath  "CALDISS_Anonymiserings_program-windows.zip"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: CALDISS_Anonymiserings_program-Windows
          path: dist/CALDISS_Anonymiserings_program/