name: Build app

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Check uv version
        run: uv --version

      - name: Sync project dependencies
        run: uv sync --frozen

      - name: Test frontend imports
        run: uv run python -c "import Pipelines.Frontend.frontend_main; print('Frontend imported successfully')"

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Check PyInstaller version
        run: uv run pyinstaller --version

      - name: Build Windows executable
        run: uv run pyinstaller --onefile Pipelines/Frontend/frontend_main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: RP_ANON-Windows
          path: dist/frontend_main.exe